[package]
name = "sce_app_docs"
version = "0.0.0-dev"
edition = "2021"
description = "本地文档站"
license = "AGPL-3.0"

[[bin]]
name = "sce_app_docs"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
bgd_appsdk = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
rfd = "0.15"

[profile.release]
opt-level = 2
strip = true
